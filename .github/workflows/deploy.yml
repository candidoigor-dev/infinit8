name: Deploy GitHub Pages

# Dispara a action sempre que houver um push na branch 'main'
on:
  push:
    branches: [ main ]

# Permite que o workflow leia o repositório e faça o deploy no Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy simultâneo por vez
concurrency:
  group: "pages"
  cancel-in-running: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Compilar Projeto (Build)
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Publicar Artefatos (Upload)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Executar Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4